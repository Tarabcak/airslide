<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AirSlide · Gesture motion study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eff2f8;font:13px -apple-system,BlinkMacSystemFont,system-ui}header{height:100px;display:flex;align-items:center;gap:22px;padding:18px 28px;border-bottom:1px solid #ffffff15}h1{font-size:17px;margin:0 0 6px}p{margin:0;color:#9ca7bc;font-size:12px}.brand{margin-right:auto}button,select{font:inherit;border:1px solid #ffffff20;background:#252b39;color:inherit;border-radius:9px;padding:10px 15px;cursor:pointer}button:hover{background:#334259}button.primary{background:#345eea}label{display:grid;gap:5px;font-size:11px;color:#acb7cc}input{accent-color:#81aaff;width:125px}iframe{display:block;width:100vw;height:calc(100vh - 100px);border:0;background:#fff}output{font-variant-numeric:tabular-nums} .hint{position:fixed;bottom:10px;left:12px;border-radius:7px;background:#111b;color:#fff;padding:5px 8px;font-size:10px;pointer-events:none}@media(max-width:900px){header{gap:8px;padding:12px}.brand p{display:none}input{width:80px}}
</style>
<header><div class="brand"><h1>AirSlide · motion study</h1><p>Local preview · no commands sent to the live presentation</p></div><label>Connected AirPod<select id="side"><option value="right">Right AirPod</option><option value="left">Left AirPod</option></select></label><label>Duration <output id="durationLabel">1.25 s</output><input id="duration" type="range" min="650" max="2200" step="50" value="1250"></label><label>Size <output id="sizeLabel">40%</output><input id="size" type="range" min="40" max="120" value="40"></label><button id="prev">← Left swing</button><button class="primary" id="next">Right swing →</button><button id="replay">Replay</button></header>
<iframe id="deck" src="/" title="Your deck with the AirSlide animation"></iframe>
<script>
const frame=document.querySelector('#deck');let last='next';
function play(direction,navigate=true){last=direction;const win=frame.contentWindow;win.dispatchEvent(new win.CustomEvent('airslide-gesture',{detail:{direction,side:document.querySelector('#side').value,duration:Number(document.querySelector('#duration').value),scale:Number(document.querySelector('#size').value)/100}}));if(navigate)win.document.dispatchEvent(new win.KeyboardEvent('keydown',{key:direction==='next'?'ArrowRight':'ArrowLeft',bubbles:true}));}
document.querySelector('#prev').onclick=()=>play('prev');document.querySelector('#next').onclick=()=>play('next');document.querySelector('#replay').onclick=()=>play(last,false);
document.querySelector('#duration').oninput=e=>document.querySelector('#durationLabel').value=(e.target.value/1000).toFixed(2)+' s';document.querySelector('#size').oninput=e=>document.querySelector('#sizeLabel').value=e.target.value+'%';
</script></html>
